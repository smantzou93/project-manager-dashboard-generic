name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the previous run on the same ref; nobody needs the
# results of a commit that has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  # Structured logs go to stdout as well as to logs/, so a failing CI job
  # carries its own trace in the run output.
  LOG_LEVEL: info
  PMD_LOG_TO_FILE: '0'

jobs:
  # ---------------------------------------------------------------------------
  # The same four commands the pre-commit hook runs. Fast, no services.
  # ---------------------------------------------------------------------------
  gates:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # ---------------------------------------------------------------------------
  # Metric definitions against the pinned fixture. Needs Postgres, which is why
  # this is here and not in a git hook.
  # ---------------------------------------------------------------------------
  integration:
    name: Metrics against the pinned fixture
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: pmdash
          POSTGRES_PASSWORD: ci-not-a-secret
          POSTGRES_DB: pmdash
        ports: ['5432:5432']
        # Without a healthcheck the job races initdb and fails intermittently,
        # which is worse than failing consistently.
        options: >-
          --health-cmd "pg_isready -U pmdash"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://pmdash:ci-not-a-secret@127.0.0.1:5432/pmdash
      POSTGRES_USER: pmdash
      POSTGRES_PASSWORD: ci-not-a-secret
      POSTGRES_DB: pmdash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # The suite refuses to run against a live-clock fixture, so the clock is
      # pinned here exactly as tests/fixtures.ts expects.
      - name: Prepare the fixture
        run: |
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env
          npm run db:migrate
          PMDASH_SEED_NOW=2026-10-01T12:00:00Z npm run db:seed -- construction

      - run: npm run test:integration

  # ---------------------------------------------------------------------------
  # Python importer. The fast tests need nothing; the db-marked ones need
  # Postgres, so both run here rather than splitting the suite across jobs.
  # ---------------------------------------------------------------------------
  ingestion:
    name: CSV ingestion
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: pmdash
          POSTGRES_PASSWORD: ci-not-a-secret
          POSTGRES_DB: pmdash
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pmdash"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://pmdash:ci-not-a-secret@127.0.0.1:5432/pmdash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - run: pip install -e 'apps/ingestion[dev]'

      - name: Prepare the fixture
        run: |
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env
          npm run db:migrate
          PMDASH_SEED_NOW=2026-10-01T12:00:00Z npm run db:seed -- construction

      - run: ruff check apps/ingestion
      - run: pytest apps/ingestion/tests -q

  # ---------------------------------------------------------------------------
  # Screenshots. Linux baselines are the authoritative ones -- font
  # rasterisation differs from macOS, so a laptop-generated baseline can never
  # match this runner.
  # ---------------------------------------------------------------------------
  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: pmdash
          POSTGRES_PASSWORD: ci-not-a-secret
          POSTGRES_DB: pmdash
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pmdash"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://pmdash:ci-not-a-secret@127.0.0.1:5432/pmdash
      PMDASH_AS_OF: '2026-10-01T12:00:00Z'
      PMDASH_SEED_NOW: '2026-10-01T12:00:00Z'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Prepare the fixture
        run: |
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env
          npm run db:migrate
          npm run db:seed -- construction

      # dev.sh is skipped here: it starts a container runtime, and Postgres is
      # already provided as a service. The fixture above is the part that
      # matters.
      # Contract tests first: spec-driven, no browser, and they fail fast when
      # the API has drifted from its published document.
      - name: Contract tests against the OpenAPI document
        run: npx playwright test --project=api

      - name: Run the visual suite
        id: visual
        run: npx playwright test --project=desktop --project=dark --project=mobile
        env:
          PMDASH_SKIP_STACK: '1'

      - name: Upload the report, diffs and any new baselines
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            tests/visual/__baselines__/linux/
          retention-days: 14

      # Linux baselines are authoritative and are produced by automation, not
      # by hand: `npm run baselines:linux` locally, or the
      # "Update screenshot baselines" workflow (also triggered by commenting
      # /baselines on a PR). Point at that rather than asking anyone to
      # download and unpack an artifact.
      - name: Explain a missing-baseline failure
        if: failure()
        run: |
          if [ -d tests/visual/__baselines__/linux ]; then
            echo "::notice::Screenshots differ from the committed Linux baselines."
            echo "::notice::If the change is intended, comment /baselines on this PR,"
            echo "::notice::or run 'npm run baselines:linux' and push the result."
          fi

      # On a PR, put the before/after images where a reviewer will see them
      # rather than making them download an artifact.
      - name: Comment the visual diff on the PR
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const dir = 'test-results';
            if (!fs.existsSync(dir)) return;

            const changed = fs.readdirSync(dir, { withFileTypes: true })
              .filter((d) => d.isDirectory())
              .map((d) => d.name)
              .filter((name) =>
                fs.readdirSync(path.join(dir, name)).some((f) => f.endsWith('-diff.png')));

            if (changed.length === 0) return;

            const body = [
              '### Visual changes detected',
              '',
              `${changed.length} screenshot${changed.length === 1 ? '' : 's'} differ from the committed baseline.`,
              '',
              ...changed.map((name) => `- \`${name.replace(/-(desktop|dark|mobile)$/, '')}\``),
              '',
              'The expected, actual and diff images are in the **playwright-report** artifact on this run.',
              '',
              'If the change is intended, refresh the baselines and the documentation screenshots:',
              '',
              '```bash',
              '# Either comment /baselines on this PR, or run locally:',
              'npm run baselines:linux      # regenerates the authoritative Linux set via Docker',
              '```',
            ].join('\n');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
