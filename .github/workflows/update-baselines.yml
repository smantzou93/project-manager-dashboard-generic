name: Update screenshot baselines

# Run it from the Actions tab, or by commenting `/baselines` on a pull request.
#
# Exists because the Linux baselines are the authoritative ones and nobody
# should have to produce them by hand. The previous instruction was "let CI
# fail, download the artifact, extract it, commit it", which is a slow loop
# and easy to get wrong.
#
# `scripts/baselines-linux.sh` does the same job locally via Docker when you
# want them before pushing.
on:
  workflow_dispatch:
    inputs:
      preset:
        description: 'Preset to capture'
        default: construction
        type: string
  issue_comment:
    types: [created]

# Writing to the branch is the entire point, so the token needs it. Nothing
# else is granted.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: baselines-${{ github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  update:
    # On a comment, only for a PR, only `/baselines`, and only from someone who
    # can already write to the repository — this job pushes commits.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
       contains(github.event.comment.body, '/baselines') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    name: Regenerate on Linux and commit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: pmdash
          POSTGRES_PASSWORD: ci-not-a-secret
          POSTGRES_DB: pmdash
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U pmdash"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgres://pmdash:ci-not-a-secret@127.0.0.1:5432/pmdash
      PMDASH_AS_OF: '2026-10-01T12:00:00Z'
      PMDASH_SEED_NOW: '2026-10-01T12:00:00Z'
      PRESET: ${{ inputs.preset || 'construction' }}

    steps:
      # A comment event checks out the default branch, so the PR's head has to
      # be resolved explicitly or the baselines land on the wrong branch.
      - name: Resolve the pull request branch
        if: github.event_name == 'issue_comment'
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('ref', pr.data.head.ref);
            core.setOutput('repo', pr.data.head.repo.full_name);

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.pr.outputs.ref || github.ref }}
          repository: ${{ steps.pr.outputs.repo || github.repository }}

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Prepare the pinned fixture
        run: |
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env
          npm run db:migrate
          npm run db:seed -- "$PRESET"

      # --update-snapshots rewrites rather than compares, so this step cannot
      # fail on a diff; a failure here means something is actually broken.
      - name: Regenerate the baselines and the documentation screenshots
        run: |
          PMDASH_WRITE_DOCS=1 npx playwright test \
            --project=desktop --project=dark --project=mobile \
            --update-snapshots

      - name: Commit, if anything changed
        id: commit
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add tests/visual/__baselines__/linux docs/screenshots
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Baselines already match; nothing to commit."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git commit -m "Update Linux screenshot baselines

          Regenerated on ubuntu-latest, which is authoritative: font
          rasterisation differs from macOS, so a locally captured baseline can
          never match a runner.

          Triggered by ${{ github.event_name }}."
          git push

      - name: Say what happened
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            const changed = '${{ steps.commit.outputs.changed }}' === 'true';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: changed
                ? 'Linux baselines regenerated and pushed to this branch. Pull before you continue.'
                : 'Baselines already match the current rendering — nothing to commit.',
            });
